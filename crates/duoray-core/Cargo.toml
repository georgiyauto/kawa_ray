[package]
name = "duoray-core"
version = "0.4.38"
edition = "2024"
description = "DUORAY core: subscriptions, share links, xray runtime configs, helper protocol"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
fastrand = "2.5.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
