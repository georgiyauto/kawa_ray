# Build/stage only. Owner repository URL and publishing authorization are pending.
name: Kawa desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kawa-desktop-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.99.0'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fixed Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-msvc
          rustup override set $env:RUST_VERSION
      - name: NSIS 3.11
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Test Windows runtime
        shell: bash
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc
      - name: Build installer and portable
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          sh packaging/windows/build.sh x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          if-no-files-found: error
          path: dist/*
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fixed Rust toolchain and system build dependencies
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION"
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libssl-dev libglib2.0-dev libgtk-3-dev desktop-file-utils curl unzip file
      - name: Test and package
        run: |
          python3 packaging/test_packaging.py
          cargo test --locked --workspace
          sh packaging/linux/stage.sh ${{ matrix.arch }}
          sh packaging/linux/packages.sh ${{ matrix.arch }}
          sh packaging/linux/kawa-appimage.sh ${{ matrix.arch }}
          sh packaging/linux/smoke-test.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fixed Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.arch }}-apple-darwin
          rustup override set "$RUST_VERSION"
      - name: Test native code
        run: cargo test --locked --workspace
      - name: Build app, protected helper installer and disk image
        run: sh packaging/macos/build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*
